<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Todo API</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>My To-do List</h1>
    <p>JavaScript frontend + ASP.NET Core controller API</p>
    <form id="add-form"><input id="new-name" required maxlength="120" placeholder="Add a task" aria-label="New task"><button>Add task</button></form>
    <p id="message" role="status"></p>
    <ul id="items"></ul>
  </main>
</body>
</html>
